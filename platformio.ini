; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Target: Waveshare ESP32-S3-AUDIO-Board
;   - ESP32-S3R8, 16MB Quad Flash + 8MB Octal PSRAM  -> memory_type = qio_opi
;   - Native USB (no UART bridge)                    -> ARDUINO_USB_CDC_ON_BOOT=1
;   - Pin map: see include/hardware_pins.h and docs/hardware_migration_esp32s3.md
[env:esp32s3_audio]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; --- Memory layout (override devkitc-1 defaults: 8MB / no PSRAM) ---
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

; --- Upload / monitor (native USB CDC) ---
upload_speed = 921600
monitor_speed = 115200

lib_deps =
  adafruit/Adafruit ST7735 and ST7789 Library
  adafruit/Adafruit GFX Library

build_flags =
  -D BOARD_HAS_PSRAM
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D AUDIO_SAMPLE_RATE=16000
